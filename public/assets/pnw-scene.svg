<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder Pacific Northwest scene. Replace with a real photo (assets/hero.jpg) when available. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb8c2"/>
      <stop offset="0.55" stop-color="#d9d6c7"/>
      <stop offset="1" stop-color="#efe2c8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9ea6"/>
      <stop offset="1" stop-color="#4d6c72"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4ee"/>
      <stop offset="0.35" stop-color="#c9d2d3"/>
      <stop offset="1" stop-color="#8ea3a8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="250" r="70" fill="#f7ead0" opacity="0.8"/>
  <!-- distant volcano -->
  <path d="M760 520 L1040 230 Q1065 210 1090 232 L1400 520 Z" fill="url(#peak)"/>
  <path d="M1000 272 L1040 230 Q1065 210 1090 232 L1130 272 L1100 262 L1080 285 L1060 262 L1035 288 Z" fill="#ffffff" opacity="0.9"/>
  <!-- far ridges -->
  <path d="M0 560 L120 470 L240 520 L380 430 L520 510 L660 450 L820 530 L980 470 L1140 540 L1300 460 L1460 520 L1600 470 L1600 900 L0 900 Z" fill="#6f8a8c" opacity="0.75"/>
  <!-- lake -->
  <rect y="600" width="1600" height="300" fill="url(#water)"/>
  <path d="M0 612 H1600" stroke="#c9d6d4" stroke-width="2" opacity="0.5"/>
  <!-- mid ridge -->
  <path d="M0 640 L160 560 L300 610 L440 545 L600 620 L0 700 Z" fill="#3f5a52"/>
  <path d="M1000 630 L1180 548 L1330 600 L1460 540 L1600 590 L1600 700 L1000 700 Z" fill="#3f5a52"/>
