  <g fill="#1f3a32">
    <path d="M0 900 V660 L40 600 L80 660 L60 660 L100 590 L140 660 L120 660 L170 570 L220 670 L200 670 L250 610 L300 690 L330 640 L380 720 L380 900 Z"/>
    <path d="M1600 900 V640 L1560 580 L1520 650 L1540 650 L1490 560 L1440 660 L1460 660 L1410 600 L1360 690 L1380 690 L1330 630 L1280 720 L1250 680 L1210 760 L1210 900 Z"/>
  </g>
  <g fill="#16302a">
    <path d="M0 900 V760 L60 690 L120 780 L170 720 L230 800 L290 740 L360 840 L440 790 L520 900 Z"/>
    <path d="M1600 900 V750 L1530 680 L1470 780 L1420 720 L1360 810 L1300 760 L1230 850 L1150 820 L1080 900 Z"/>
